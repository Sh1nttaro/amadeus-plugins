<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Amadeus 3D</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' amadeus-3d: blob: data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: amadeus-3d:; connect-src 'self' amadeus-3d: blob: data:; frame-src 'self'">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    canvas { position: absolute; inset: 0; display: block; }
    #bubble { position: absolute; display: none; border: 0; background: transparent; pointer-events: none; color-scheme: normal; }
    /* subtitles (one or two lines at the character, words appear with the voice) */
    #subs { position: absolute; left: 0; top: 0; display: none; pointer-events: none; max-width: 440px; box-sizing: border-box;
      font: 500 14px/1.38 'Segoe UI', system-ui, sans-serif; color: #f7f5fb; background: rgba(24, 21, 28, .86);
      padding: 6px 13px 7px; border-radius: 11px; box-shadow: 0 3px 14px rgba(0, 0, 0, .28); text-align: center;
      transition: opacity .22s ease, translate .22s ease; opacity: 0; translate: 0 4px; }
    #subs.on { opacity: 1; translate: 0 0; }
    #subs .w { animation: wIn .24s ease-out both; }
    @keyframes wIn { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
    #subs.status { font-size: 12px; padding: 5px 11px; opacity: .92; }
    #subs .lbl { opacity: .8; margin-left: 6px; }
    #subs .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
    #subs .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: dot 1.2s infinite ease-in-out; }
    #subs .dots i:nth-child(2) { animation-delay: .15s; } #subs .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
    /* bubble (portrait) mode: a white ring around the round window onto the character */
    #ring { position: absolute; display: none; pointer-events: none; box-sizing: border-box; border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, .94); box-shadow: 0 6px 22px rgba(0, 0, 0, .32), inset 0 0 0 1px rgba(0, 0, 0, .18);
      background: radial-gradient(closest-side, rgba(255, 255, 255, 0) 72%, rgba(20, 18, 26, .16)); }

    /* bubble mode: microphone and speaker buttons on the ring */
    .pbtn { position: absolute; display: none; width: 34px; height: 34px; margin: -17px 0 0 -17px; padding: 0; border: 0; border-radius: 50%;
      background: rgba(28, 26, 36, .86); color: #fff; cursor: pointer; pointer-events: auto; box-shadow: 0 3px 10px rgba(0, 0, 0, .35), 0 0 0 2px rgba(255, 255, 255, .9);
      transition: transform .18s ease, background .25s ease, opacity .25s ease; outline: none; }
    .pbtn:hover { transform: scale(1.12); }
    .pbtn:active { transform: scale(.92); }
    .pbtn svg { position: absolute; left: 7px; top: 7px; width: 20px; height: 20px; overflow: visible; }
    .pbtn .slash { stroke: #ff6b6b; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset .3s ease; }
    .pbtn.off { background: rgba(60, 58, 66, .82); }
    .pbtn.off svg .body { opacity: .55; }
    .pbtn.off .slash { stroke-dashoffset: 0; }
    /* microphone: breathing halo while listening, bars while it hears you, a spinner while recognising */
    .pbtn .halo { position: absolute; inset: -2px; border-radius: 50%; pointer-events: none; opacity: 0; }
    #bMic:not(.off) .halo { animation: halo 2.4s ease-out infinite; }
    #bMic:not(.off) { color: #7ee2b0; }
    #bMic.hear { background: rgba(46, 160, 110, .95); color: #fff; }
    #bMic.busy { background: rgba(28, 26, 36, .92); color: #fff; }
    #bMic.hear .halo { animation: halo .9s ease-out infinite; }
    #bMic.busy .halo { opacity: 1; inset: -5px; animation: spin .8s linear infinite; border: 3px solid rgba(255, 255, 255, .18); border-top-color: #fff; border-right-color: #7ee2b0; }
    #bMic.busy .bars { display: none !important; }
    #bMic.sent { animation: pop .45s ease; }
    @keyframes halo { 0% { opacity: .7; box-shadow: 0 0 0 0 rgba(126, 226, 176, .75); } 100% { opacity: 0; box-shadow: 0 0 0 12px rgba(126, 226, 176, 0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
    .pbtn .bars { position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); display: none; gap: 2px; align-items: flex-end; height: 9px; }
    .pbtn .bars i { width: 3px; border-radius: 2px; background: #7ee2b0; animation: bar .6s ease-in-out infinite; }
    .pbtn .bars i:nth-child(2) { animation-delay: .15s; } .pbtn .bars i:nth-child(3) { animation-delay: .3s; }
    #bMic.hear .bars { display: flex; }
    @keyframes bar { 0%, 100% { height: 3px; } 50% { height: 9px; } }
    /* speaker: waves move while she talks */
    #bSpk .wave { stroke-dasharray: 14; stroke-dashoffset: 0; transition: opacity .25s; }
    #bSpk.off .wave { opacity: 0; }
    #bSpk.talk .w1 { animation: wave 1s ease-in-out infinite; }
    #bSpk.talk .w2 { animation: wave 1s ease-in-out .2s infinite; }
    @keyframes wave { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    /* emotion symbols around the head */
    #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #fx .sym { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; animation: symPop 1.5s ease-out forwards; }
    #fx .sym svg { width: 100%; height: 100%; overflow: visible; }
    @keyframes symPop { 0% { opacity: 0; transform: scale(.2) translateY(0) rotate(var(--r, 0deg)); } 18% { opacity: 1; transform: scale(1.15) translateY(-2px) rotate(var(--r, 0deg)); }
      30% { transform: scale(1) translateY(-4px) rotate(var(--r, 0deg)); } 100% { opacity: 0; transform: scale(.9) translateY(var(--rise, -22px)) rotate(var(--r, 0deg)); } }
    #fx .sym.pulse { animation: symPulse 1.5s ease-in-out forwards; }
    @keyframes symPulse { 0% { opacity: 0; transform: scale(.3); } 15% { opacity: 1; transform: scale(1.2); } 30%, 60% { transform: scale(.95); } 45%, 75% { transform: scale(1.12); } 100% { opacity: 0; transform: scale(1); } }
  </style>
  <script type="importmap">{ "imports": { "three": "./three/three.module.js" } }</script>
</head>
<body>
  <canvas id="c"></canvas>
  <iframe id="bubble" src="bubble/bubble.html" title="Ответ" allowtransparency="true"></iframe>
  <div id="ring"></div>
  <div id="fx"></div>
  <div id="subs"></div>
  <button id="bMic" class="pbtn off" type="button" title="Микрофон: слушать «Алиса»"><span class="halo"></span>
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g class="body"><rect x="7" y="2.5" width="6" height="10" rx="3" fill="currentColor" stroke="none"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></g><line class="slash" x1="3" y1="3" x2="17" y2="17"/></svg>
    <span class="bars"><i></i><i></i><i></i></span></button>
  <button id="bSpk" class="pbtn" type="button" title="Звук её голоса">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g class="body"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path class="wave w1" d="M13 7.5a3.5 3.5 0 0 1 0 5"/><path class="wave w2" d="M15.3 5.3a6.6 6.6 0 0 1 0 9.4"/></g><line class="slash" x1="3" y1="3" x2="17" y2="17"/></svg></button>
  <script type="module" src="pet.js"></script>
</body>
</html>
